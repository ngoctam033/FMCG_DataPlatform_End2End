name: fmcg-odoo-simulator

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fmcg_erp
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD before starting the stack}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - odoo-network

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD before starting the stack}
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - ../config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ../addons:/mnt/extra-addons:ro
      - ../.local/odoo:/var/lib/odoo
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8069/web/health?db_server_status=true', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - odoo-network

  inventory-simulator:
    build:
      context: ./inventory-simulator
    profiles: [simulator]
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      ODOO_BASE_URL: ${ODOO_BASE_URL:-http://odoo:8069}
      ODOO_DATABASE: ${ODOO_DATABASE:-fmcg_erp}
      ODOO_API_KEY: ${ODOO_API_KEY:?Set ODOO_API_KEY for the inventory simulator}
      SIMULATOR_CRON: ${SIMULATOR_CRON:-*/5 * * * *}
      SIMULATOR_BATCH_SIZE: ${SIMULATOR_BATCH_SIZE:-50}
      SIMULATOR_RUN_ON_START: ${SIMULATOR_RUN_ON_START:-true}
      SIMULATOR_TIMEZONE: ${SIMULATOR_TIMEZONE:-Asia/Ho_Chi_Minh}
      ODOO_REQUEST_TIMEOUT: ${ODOO_REQUEST_TIMEOUT:-120}
      SIMULATOR_LOOKUP_PAGE_SIZE: ${SIMULATOR_LOOKUP_PAGE_SIZE:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    networks:
      - odoo-network

networks:
  odoo-network:
    driver: bridge
